<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cummins Engines</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Cummins Engines </h1>
  </header>

  <main class="contenedor">
    <!-- Selección de Familias -->
    <section>
      <h2>Family / Series</h2>
      <div id="grid-familias" class="grid-cards"></div>
    </section>

    <!-- Submenú de Motores por Familia -->
    <section id="seccion-motores" class="oculto">
      <h2 id="titulo-familia"></h2>
      <div id="grid-motores" class="grid-cards"></div>
    </section>

    <!-- Detalle Técnico del Motor Seleccionado -->
    <section id="detalle-motor" class="oculto">
      <h2 id="nombre-motor"></h2>
      <div class="detalle-contenido">
        <img id="img-motor" src="" alt="Motor Cummins">
        <div id="tabla-especificaciones"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
